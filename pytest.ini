[pytest]
# Both suites: `tests/` is the v2 suite; `test/` holds the original checks,
# which now run against the compatibility shims in card.py / hand.py / game.py.
testpaths = tests test
addopts = -q --basetemp=.pytest_tmp
# pytest's tmp_path is rooted inside the project because some sandboxed
# environments cannot write to the system temp directory.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:openai.*
